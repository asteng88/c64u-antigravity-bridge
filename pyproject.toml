[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c64u-bridge"
version = "0.1.0"
description = "Agent-driven bridge connecting Google Antigravity to the Commodore 64 Ultimate (C64U) for 6502 assembly compilation, DMA execution, and real-time hardware telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Andrew Thomas" }
]
keywords = [
    "commodore64",
    "c64",
    "c64u",
    "ultimate64",
    "antigravity",
    "mcp",
    "model-context-protocol",
    "6502",
    "retrogaming"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "textual>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
c64u-bridge = "c64u_bridge.cli:main"
c64u-mcp = "c64u_bridge.server:main"
c64u-py2asm = "c64u_bridge.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/c64u_bridge"]
